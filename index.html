<!doctype html>
<html lang="en" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Girasol Facade</title>
  <meta name="description" content="Drag the sun and watch Girasol's solar facade open to follow it.">

  <meta property="og:title" content="Girasol Facade">
  <meta property="og:description" content="The building follows the sun all day to make its own energy.">
  <meta property="og:url" content="https://girasol-facade.vercel.app/index.html">
  <meta property="og:image" content="https://girasol-facade.vercel.app/images/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Girasol logo: the word Girasol with the o drawn as a hexagon around a sun-yellow triangle.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="home">

  <nav class="site-nav" aria-label="Main">
    <a class="brand" href="index.html" aria-label="Girasol, home"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path class="logo-hex" d="M50 7 L87.2 28.5 L87.2 71.5 L50 93 L12.8 71.5 L12.8 28.5 Z"/><path class="logo-tri" d="M50 7 L87.2 71.5 L12.8 71.5 Z"/></svg></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu-list">Menu</button>
    <ul id="menu-list">
      <li><a href="index.html" aria-current="page">Home</a></li>
      <li><a href="day.html">A Day</a></li>
      <li><a href="module.html">The Module</a></li>
      <li><button type="button" data-logout>Log out</button></li>
    </ul>
  </nav>

  <div class="stage">
    <canvas id="model" class="model-canvas" role="img"
      aria-label="The Girasol facade, a wall of white triangular solar modules over a glass ground floor, standing on a ground line in front of a city skyline. The sun crosses the sky on its own, from dawn to night and round again, and every module opens and turns to follow it. Use the sun dial to set the time of day yourself."></canvas>
  </div>

  <main class="home-main page-layer">
    <div class="home-text reveal" id="home-text">
      <h1 class="title" aria-label="Girasol"><span class="title-letters" aria-hidden="true"><span class="ch" style="--i:0">G</span><span class="ch" style="--i:1">i</span><span class="ch" style="--i:2">r</span><span class="ch" style="--i:3">a</span><span class="ch" style="--i:4">s</span><span class="ch ch-mark" style="--i:5"><svg class="title-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path class="logo-hex" d="M50 7 L87.2 28.5 L87.2 71.5 L50 93 L12.8 71.5 L12.8 28.5 Z"/><path class="logo-tri" d="M50 7 L87.2 71.5 L12.8 71.5 Z"/></svg></span><span class="ch" style="--i:6">l</span></span></h1>
      <p class="key">The building follows the sun all day to make its own energy.</p>
      <div class="home-actions">
        <a class="btn" href="day.html">Watch a whole day</a>
      </div>
    </div>

    <div class="dial-wrap reveal" id="dial-wrap">
      <div class="dial" id="dial" role="slider" tabindex="0"
        aria-label="Time of day" aria-valuemin="0" aria-valuemax="24" aria-valuenow="9" aria-valuetext="09:00">
        <svg class="dial-face" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <circle class="dial-ring" cx="100" cy="100" r="80"/>
          <circle class="dial-ring dial-ring-inner" cx="100" cy="100" r="64"/>
          <g id="dial-ticks"></g>
          <line class="dial-horizon" x1="20" y1="100" x2="180" y2="100"/>
          <g id="dial-sun"><circle class="dial-sun" cx="100" cy="20" r="10"/></g>
        </svg>
        <span class="dial-label dial-n">12 Noon</span>
        <span class="dial-label dial-e">6 Sunrise</span>
        <span class="dial-label dial-w">18 Sunset</span>
        <span class="dial-label dial-s">0 Midnight</span>
        <span class="dial-time" id="dial-time">09:00</span>
        <div class="dial-note" id="hint" aria-hidden="true">
          <span class="dial-note-text">Spin the sun</span>
          <svg class="dial-note-arrow" viewBox="0 0 100 80" focusable="false">
            <path class="arrow-line" pathLength="1" d="M88 10 C 60 4, 26 18, 12 64"/>
            <path class="arrow-head" d="M3 52 L12 66 L24 56"/>
          </svg>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    Girasol Facade. A speculative design concept by Francisco Herrero.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script type="module" src="js/home.js"></script>
</body>
</html>
