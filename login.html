<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Girasol Facade</title>
  <meta name="description" content="Log in to Girasol, a building that follows the sun all day to make its own energy.">

  <meta property="og:title" content="Girasol Facade">
  <meta property="og:description" content="The building follows the sun all day to make its own energy.">
  <meta property="og:image" content="images/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Placeholder for an image of the Girasol facade opening at noon.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login">

  <!-- The 3D facade will render here in a later step -->
  <div class="login-stage" role="img" aria-label="The Girasol facade, its triangular solar modules slowly opening and closing behind frosted glass."></div>
  <div class="login-frost" aria-hidden="true"></div>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Girasol</h1>
      <p class="key">The building follows the sun all day to make its own energy.</p>

      <form class="login-form" id="login-form" method="post" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        <button class="btn" type="submit" id="submit-btn">Log in</button>
      </form>

      <p class="login-switch">
        <span id="switch-text">New here?</span>
        <button class="link-btn" type="button" id="switch-btn">Create account</button>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    Girasol Facade. A speculative design concept by Francisco Herrero.
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
